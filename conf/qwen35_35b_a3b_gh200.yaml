# Clariden (CSCS Alps, 4x GH200 per node, Slingshot-11) profile for the official recipe
#   megatron.bridge.recipes.qwen35_text_35b_a3b_pretrain_8gpu_gb200_bf16_config
#
# Merged onto the recipe by train/pretrain.py before the launcher's KEY=VALUE overrides.
# Only *platform* deviations live here; anything not listed keeps the recipe value.
# Parallel sizes, batch sizes, precision of the gradient reduction and CUDA graphs are
# per-run choices made in launch.sh (LAYOUT presets), because they depend on node count.

model:
  # GB200 NVL72 uses the HybridEP flex dispatcher (NVLink-domain aware). Its cross-node
  # path, like DeepEP's, needs InfiniBand GPU-initiated RDMA, which Slingshot (libfabric/CXI)
  # does not provide; the standard NCCL all-to-all dispatcher is the portable choice
  # (moe_preprocess CUDA graphs remain supported with it for dropless routing).
  # With the expert group inside one node (EP*ETP <= 4) HybridEP's NVLink path works on
  # GH200 too: launch.sh DISPATCHER=hybridep overrides these two keys.
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null

comm_overlap:
  # TP=1, so TE userbuffers TP overlap is meaningless (Bridge would disable it with a warning).
  tp_comm_overlap: false
  # On GB200 EP=8 fits inside one NVLink domain and the recipe turns DP overlap off. Here the
  # data-parallel reduce-scatter / all-gather crosses Slingshot, so overlap it with compute.
  # (These values are applied over ddp.* at setup, so they are the ones that matter.)
  overlap_grad_reduce: true
  overlap_param_gather: true

ddp:
  overlap_grad_reduce: true
  overlap_param_gather: true

dataset:
  # ~1000+ blend prefixes: build the per-prefix sample indices in parallel the first time
  # (cached under dataset.path_to_cache afterwards). Does not change which samples are drawn.
  num_dataset_builder_threads: 8
  # Megatron's GPTDataset builds a [1, 4096, 4096] attention mask (16.7 MB) and caches it per dataset
  # object, i.e. per blend prefix (964) in every dataloader worker: host memory grew ~5 GB/min per node
  # until the kernel OOM-killed a rank (jobs 3703471, 3703919, 3704232). Bridge never uses it
  # (skip_getting_attention_mask_from_dataset defaults to True: the model gets None and attention
  # applies its causal mask itself), so not creating it changes nothing else.
  create_attention_mask: false
  # A rank needs ~3.5 samples/s at most; 2 workers per rank are plenty (the recipe has 8).
  num_workers: 2

dist:
  # First steps include TE/Triton JIT and CUDA-graph capture on every rank; on a busy
  # Lustre the default 10 min NCCL timeout can be hit during the first collectives.
  distributed_timeout_minutes: 30

logger:
  log_interval: 1
  log_throughput: true
  log_throughput_to_tensorboard: true
  throughput_window_size: 10
  log_timers_to_tensorboard: true
  # Level 1: once-per-step phases, printed every step with min/max over ranks and sent to W&B:
  # forward-backward, all-grads-sync (gradient reduction left after the backward = exposed DP
  # communication), params-all-gather, optimizer. Level 2 adds per-micro-batch timers that
  # synchronize the GPU 32+ times per step; the data wait is timed in train/pretrain.py instead.
  timing_log_level: 1
  log_memory_to_tensorboard: true
  # Validation perplexity (exp of each validation loss) to W&B / TensorBoard as "<loss> validation ppl".
  log_validation_ppl_to_tensorboard: true
  log_params_norm: false

checkpoint:
  # Keep the last few checkpoints only (each is ~0.5 TB with fp32 optimizer state: measured 469 GB).
  most_recent_k: 3
  # Split the checkpoint read across data-parallel ranks (exchanged over NCCL) instead of every
  # replica reading its whole shard: with the default, all 4 ranks of a node held a full shard in
  # host memory while loading (~6 min at 8 nodes) and the node ran out of host memory soon after
  # (job 3703471).
  fully_parallel_load: true
